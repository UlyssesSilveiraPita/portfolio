<!doctype html>
<html lang="en">
  <head>
    <title>Contact</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <meta name="description" content="Your description" />
    <meta name="keywords" content="Your keywords" />
    <meta name="author" content="Your name" />
    <link
      rel="stylesheet"
      href="css/bootstrap.css"
      type="text/css"
      media="screen"
    />
    <link
      rel="stylesheet"
      href="css/style.css"
      type="text/css"
      media="screen"
    />

    <script type="text/javascript" src="js/include_script.js"></script>

    <![endif]-->
  </head>
  <body>
    <!--content wrapper-->
    <div id="wrapper">
      <section>
        <div class="dynamicContent">
          <!--content-->
          <div class="row">
            <div class="span7">
              <h2>Contact Information</h2>
              <div class="row">
                <div class="span4">
                  <figure class="g_map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6049.61725979378!2d-49.322008533253594!3d-25.63401159566065!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94dcff0e250e9ed9%3A0x20538cec44f3b5d1!2sR.%20Nelson%20Claudino%20dos%20Santos%2C%201-271%20-%20Pioneiros%2C%20Fazenda%20Rio%20Grande%20-%20PR%2C%2083833-000!5e0!3m2!1ses!2sbr!4v1780750549584!5m2!1ses!2sbr"
                      width="600"
                      height="450"
                      style="border: 0"
                      allowfullscreen=""
                      loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade"
                    ></iframe>
                  </figure>
                </div>
                <div class="span3">
                  <br />Fazenda Rio grande - Paraná
                  <p>Rua_<br />n* <br /></p>
                  <p class="_marginNull">
                    <span class="space1">Telephone:</span>+55 41 99915-4161<br />
                    <span class="space2">E-mail:</span>
                    <!--email_off--><a href="mailto:#" class="_link3"
                      >ulyssespita0@gmail.com</a
                    ><!--/email_off-->
                  </p>
                </div>
              </div>
            </div>
            <div class="span5">
              <h2>Contact Us</h2>
              <form id="form1">
                <div class="success">
                  <span
                    >Contact form sent!<strong>
                      We will be in touch soon.</strong
                    ></span
                  >
                </div>
                <fieldset>
                  <label class="name">
                    <input type="text" value="Name:" />
                    <span class="error w1">*That is not a valid name..</span>
                    <span class="empty w1">*This field is required.</span>
                  </label>
                  <label class="email">
                    <input type="email" value="E-mail:" />
                    <span class="error w1"
                      >*This is not a valid email address..</span
                    >
                    <span class="empty w1">*This field is required.</span>
                  </label>
                  <label class="message">
                    <textarea>Message:</textarea>
                    <span class="error">*The message is too short.</span>
                    <span class="empty">*This field is required.</span>
                  </label>
                  <br class="clear" />
                  <div class="btns">
                    <a href="#" class="btn-link more_btn1" data-type="submit"
                      >To send</a
                    >
                    <a href="#" class="btn-link more_btn1" data-type="reset"
                      >To clean</a
                    >
                  </div>
                </fieldset>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="text/javascript" src="js/bootstrap.js"></script>
    <script type="text/javascript">
      jQuery("#form1").forms({ ownerEmail: "#" });
    </script>
    <script>
      const energyBall = document.querySelector(".energy-ball");

      document.addEventListener("mousemove", (e) => {
        energyBall.style.left = `${e.clientX}px`;
        energyBall.style.top = `${e.clientY}px`;
      });
    </script>
  </body>
